name: CI and Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_docker:
        description: 'Publish verified images (main or version tags only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22.23.1'
  NPM_VERSION: '10.9.8'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  workflow-checks:
    name: Workflow validation and gate regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate workflow syntax and expressions
        run: |
          python scripts/ci/install_tool.py actionlint "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/actionlint" -color
      - name: Test evidence gates and image publication rules
        run: python -m unittest discover -s tests/ci -v

  backend-tests:
    name: Backend regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      APP_ENV: test
      PYTHONPATH: apps/api
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            requirements-ci.txt
      - name: Install locked application and CI dependencies
        run: |
          python -m pip install --require-hashes -r apps/api/requirements.txt
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Check Python syntax and run existing regressions
        run: |
          mkdir -p reports
          python -m compileall -q apps/api/app scripts/ci
          python -m pytest apps/api/tests -q --junitxml=reports/pytest.xml
      - name: Preserve backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.os }}
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: Build and regressions (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [web, crawler]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.component }}/package-lock.json
      - name: Align npm with the package contract
        run: npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
      - name: Install from lockfile
        working-directory: apps/${{ matrix.component }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run existing frontend regressions
        if: matrix.component == 'web'
        working-directory: apps/web
        run: node --test test/*.test.js
      - name: Build component
        working-directory: apps/${{ matrix.component }}
        run: npm run build
      - name: Record compiled artifact source identity
        working-directory: apps/${{ matrix.component }}
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("dist/ci-build-info.json", JSON.stringify({component:process.env.COMPONENT,revision:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID})+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-dist
          path: apps/${{ matrix.component }}/dist/
          if-no-files-found: error
          retention-days: 14

  npm-audit:
    name: npm dependency audit (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [web, crawler]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
      - run: mkdir -p reports
      - name: Reject high and critical advisories and audit errors
        working-directory: apps/${{ matrix.component }}
        run: npm audit --package-lock-only --audit-level=high --fetch-timeout=30000 --fetch-retries=3 --json > "$GITHUB_WORKSPACE/reports/npm-audit-${{ matrix.component }}.json"
      - name: Preserve npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.component }}
          path: reports/npm-audit-*.json
          if-no-files-found: warn
          retention-days: 14

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Audit the hashed runtime lockfile
        run: |
          mkdir -p reports
          python -m pip_audit -r apps/api/requirements.txt --require-hashes --strict --progress-spinner off --format json --output reports/pip-audit.json
      - name: Preserve Python audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit
          path: reports/pip-audit.json
          if-no-files-found: warn
          retention-days: 14

  code-audit:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4.39.1, same version as reference project
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          output: reports/codeql
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Reject high-risk findings and incomplete analysis
        run: python scripts/ci/gates.py sarif reports/codeql
      - name: Preserve CodeQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: reports/codeql/
          if-no-files-found: warn
          retention-days: 14

  secrets-audit:
    name: Secret scan (full Git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install checksum-verified Gitleaks
        run: python scripts/ci/install_tool.py gitleaks "$RUNNER_TEMP/ci-tools"
      - name: Scan without exposing matched credentials
        run: |
          mkdir -p reports
          "$RUNNER_TEMP/ci-tools/gitleaks" git . --log-opts="--all" --redact=100 --no-banner --exit-code 1 --report-format json --report-path reports/gitleaks.json
      - name: Preserve redacted secret scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-audit-report
          path: reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 14

  docker-check:
    name: Docker build check (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [api, web, crawler]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.component }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=xianyu-${{ matrix.component }}
          cache-to: type=gha,scope=xianyu-${{ matrix.component }},mode=min,ignore-error=true

  quality-gate:
    name: Quality gate
    if: always()
    needs: [workflow-checks, backend-tests, frontend-build, npm-audit, python-audit, code-audit, secrets-audit, docker-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require every check to succeed (including all matrix variants)
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci/gates.py jobs workflow-checks backend-tests frontend-build npm-audit python-audit code-audit secrets-audit docker-check

  publish-images:
    name: Publish verified digest (${{ matrix.component }})
    needs: quality-gate
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name == 'push' || inputs.publish_docker == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            platforms: linux/amd64,linux/arm64
          - component: web
            platforms: linux/amd64,linux/arm64
          - component: crawler
            platforms: linux/amd64
    env:
      GHCR_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Prepare validated owner-scoped image name
        id: image
        run: python scripts/ci/images.py prepare --component ${{ matrix.component }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish a source-revision tag
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.component }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=min
          cache-from: type=gha,scope=xianyu-${{ matrix.component }}
          cache-to: type=gha,scope=xianyu-${{ matrix.component }},mode=min,ignore-error=true
      - name: Record the exact build digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python scripts/ci/images.py record --component ${{ matrix.component }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.component }}
          path: reports/images/${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 30

  promote-images:
    name: Promote complete image set and mirror by digest
    needs: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: xianyu-image-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      GHCR_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
      ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: reports/images
      - name: Validate optional ACR settings
        id: acr
        env:
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: python scripts/ci/images.py registry
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to optional ACR
        if: steps.acr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - name: Read current main to prevent delayed latest promotion
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          echo "CURRENT_MAIN_SHA=$current_main" >> "$GITHUB_ENV"
      - name: Promote only validated digests from this run
        run: python scripts/ci/images.py promote
