name: CI and Native Release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish verified Windows EXE and ZIPs as the latest Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/') }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Build and regressions
    uses: ./.github/workflows/ci-checks.yml
    permissions:
      contents: read

  audits:
    name: Security audits
    uses: ./.github/workflows/security-audits.yml
    permissions:
      contents: read
      security-events: write

  quality-gate:
    name: Quality gate
    if: always()
    needs: [checks, audits]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require every test, package check and audit to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci/gates.py jobs checks audits

  publish-release:
    name: Publish latest Windows desktop Release
    needs: quality-gate
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download verified source ZIP from this run
        uses: actions/download-artifact@v4
        with:
          name: xianyu-pilot-native-source
          path: release/native
      - name: Download verified Windows portable ZIP from this run
        uses: actions/download-artifact@v4
        with:
          name: xianyu-pilot-windows-portable
          path: release/windows
      - name: Install cross-platform EXE icon verifier
        run: python -m pip install -r packaging/windows/requirements-icon-check.txt
      - name: Reverify checksums and embedded EXE icons before publishing GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/ci/native_package.py publish --directory release/native --windows-directory release/windows
      - name: Preserve Release icon verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-icon-verification
          path: release/native/publish/windows-icon-verification.json
          if-no-files-found: error
          retention-days: 14
